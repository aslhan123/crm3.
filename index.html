<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Командная CRM</title>
  <style>
    :root {
      --bg: #0a0f1e;
      --card: #141c2f;
      --border: #2a3a5a;
      --text: #e8edf5;
      --muted: #8a9bb5;
      --accent: #38d9a9;
      --primary: #4d8cf7;
      --danger: #ff6b6b;
      --input-bg: #0f172a;
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
      --radius: 12px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      min-height: 100vh;
      background-image: radial-gradient(ellipse at 10% 20%, rgba(77, 140, 247, 0.06) 0%, transparent 60%);
    }

    /* ——— Анимации ——— */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.92) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .deal-card { animation: fadeInUp 0.35s ease forwards; }
    .modal-content { animation: modalPop 0.25s ease forwards; }

    /* ——— Header ——— */
    header {
      background: rgba(20, 28, 47, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon-btn, .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      transition: all var(--transition);
      backdrop-filter: blur(4px);
    }
    .icon-btn:hover {
      background: rgba(77, 140, 247, 0.15);
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(77, 140, 247, 0.2);
    }
    .logout-btn {
      background: var(--danger);
      border: none;
      color: white;
      font-weight: 600;
    }
    .logout-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 4px 16px rgba(255, 107, 107, 0.3);
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all var(--transition);
      box-shadow: 0 2px 8px rgba(77, 140, 247, 0.3);
    }
    .user-avatar:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 16px rgba(77, 140, 247, 0.5);
    }

    /* ——— Login ——— */
    .login-screen {
      max-width: 380px;
      margin: 80px auto;
      padding: 32px;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.4s ease;
    }

    /* ——— Кнопки и поля ——— */
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: var(--radius);
      color: white;
      font-weight: 600;
      font-size: 15px;
      transition: all var(--transition);
      box-shadow: 0 4px 16px rgba(77, 140, 247, 0.25);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(77, 140, 247, 0.4);
    }
    .btn-add {
      width: auto;
      padding: 8px 24px;
      background: linear-gradient(135deg, var(--primary), #6c5ce7);
      margin: 0 auto;
      display: inline-block;
    }
    .btn-secondary {
      background: #2d3b5a;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #3a4a6e;
      transform: translateY(-2px);
    }
    .btn-danger {
      background: var(--danger);
      box-shadow: 0 4px 16px rgba(255, 107, 107, 0.25);
    }
    .btn-danger:hover {
      background: #ff5252;
    }
    input, textarea {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      transition: all var(--transition);
      width: 100%;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(77, 140, 247, 0.2);
      outline: none;
    }
    textarea { resize: vertical; min-height: 60px; }
    .input-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ——— Workspace ——— */
    .workspace-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-box {
      width: 100%;
      max-width: 400px;
      position: relative;
      margin: 0 auto;
    }
    .search-box input {
      padding-left: 34px;
    }
    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.7;
    }
    .add-btn-wrapper {
      text-align: center;
    }

    /* ——— Kanban ——— */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .kanban-col {
      background: var(--card);
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 420px;
      box-shadow: var(--shadow);
      transition: all var(--transition);
    }
    .kanban-col:hover {
      border-color: rgba(77, 140, 247, 0.3);
    }
    .col-title {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-title span {
      background: rgba(77, 140, 247, 0.15);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
    }
    .cards-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 80px;
      transition: background 0.2s;
    }
    .cards-container.drag-over {
      background: rgba(77, 140, 247, 0.08);
      border-radius: var(--radius);
    }

    /* ——— Карточки ——— */
    .deal-card {
      background: var(--bg);
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }
    .deal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(to bottom, var(--primary), var(--accent));
      opacity: 0;
      transition: opacity var(--transition);
    }
    .deal-card:hover {
      transform: translateY(-2px) scale(1.01);
      border-color: rgba(77, 140, 247, 0.4);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .deal-card:hover::before {
      opacity: 1;
    }
    .deal-card:active { cursor: grabbing; }
    .deal-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .deal-description {
      font-size: 12px;
      color: var(--muted);
      margin: 4px 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 2.8em;
    }
    .deal-budget {
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      margin-top: 2px;
    }
    .deal-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      justify-content: flex-start;
    }
    .btn-delete {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 16px;
      font-weight: bold;
      padding: 0 4px;
      transition: all var(--transition);
      opacity: 0.6;
    }
    .btn-delete:hover {
      opacity: 1;
      transform: scale(1.2);
    }

    /* ——— Модалки ——— */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
      animation: fadeInUp 0.2s ease;
    }
    .modal-content {
      background: var(--card);
      padding: 28px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .modal-content.wide {
      max-width: 550px;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .view-field {
      margin-bottom: 12px;
    }
    .view-field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .view-field .value {
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .view-field .value::-webkit-scrollbar {
      width: 4px;
    }
    .view-field .value::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* ——— Комментарии ——— */
    .comment-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .comment-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    /* ——— Корзина ——— */
    .trash-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .trash-item-info { flex: 1; }
    .trash-item-actions {
      display: flex;
      gap: 8px;
    }
    .trash-item-actions button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 6px;
      transition: all var(--transition);
      font-size: 12px;
    }
    .trash-item-actions .restore-btn {
      color: var(--accent);
      border-color: var(--accent);
    }
    .trash-item-actions .restore-btn:hover {
      background: var(--accent);
      color: #fff;
    }
    .trash-item-actions .permanent-btn {
      color: var(--danger);
      border-color: var(--danger);
    }
    .trash-item-actions .permanent-btn:hover {
      background: var(--danger);
      color: #fff;
    }

    /* ——— Скелетоны ——— */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, transparent 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: var(--radius);
      height: 72px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ——— Toast ——— */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-size: 14px;
      animation: fadeInUp 0.25s ease;
      max-width: 300px;
    }
    .toast.success { border-left: 4px solid var(--accent); }
    .toast.error { border-left: 4px solid var(--danger); }

    /* ——— Command Palette ——— */
    .command-palette {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      z-index: 150;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .command-palette input {
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 14px 16px;
      font-size: 16px;
      background: transparent;
      color: var(--text);
    }
    .command-list {
      max-height: 280px;
      overflow-y: auto;
    }
    .command-item {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      transition: background var(--transition);
    }
    .command-item:hover, .command-item.active {
      background: rgba(77, 140, 247, 0.15);
    }
    .kbd {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      color: var(--muted);
    }

    /* ——— Адаптив ——— */
    @media (max-width: 900px) {
      .kanban-grid { grid-template-columns: 1fr; }
      .search-box { max-width: 100%; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>🚀 Командная CRM</h1>
    <div id="user-info" class="header-actions hidden">
      <button class="user-avatar" id="user-avatar-btn" title="Профиль">👤</button>
      <button class="icon-btn" id="btn-trash" title="Корзина">🗑️ <span id="trash-count">0</span></button>
      <button class="icon-btn" id="btn-export" title="Экспорт">📥</button>
      <button class="icon-btn" id="btn-import" title="Импорт">📤</button>
      <button class="logout-btn" id="btn-logout">Выйти</button>
    </div>
  </header>

  <main id="login-screen" class="login-screen">
    <h2 style="margin-top:0;text-align:center;font-weight:300;">Вход в CRM</h2>
    <form id="login-form" onsubmit="return false;">
      <div class="input-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@company.com" required />
      </div>
      <div class="input-group">
        <label for="login-password">Пароль</label>
        <input type="password" id="login-password" placeholder="Минимум 6 символов" required />
      </div>
      <button class="btn" id="btn-login" type="button">Войти</button>
    </form>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:16px;">
      Создайте пользователя в Firebase → Authentication
    </p>
  </main>

  <main id="crm-screen" class="crm-screen hidden">
    <div class="workspace-header">
      <div class="search-box">
        <input type="search" id="global-search" placeholder="Поиск проектов..." />
      </div>
      <div class="add-btn-wrapper">
        <button class="btn btn-add" id="btn-open-modal">+ Новый проект</button>
      </div>
    </div>

    <div class="kanban-grid">
      <div class="kanban-col">
        <h3 class="col-title" style="color:#94a3b8;">💬 Обсуждение <span id="count-Discussion">0</span></h3>
        <div id="Discussion" class="cards-container"></div>
      </div>
      <div class="kanban-col">
        <h3 class="col-title" style="color:#60a5fa;">🛠️ В работе <span id="count-In_Progress">0</span></h3>
        <div id="In_Progress" class="cards-container"></div>
      </div>
      <div class="kanban-col">
        <h3 class="col-title" style="color:#fbbf24;">🧪 Тест <span id="count-Testing">0</span></h3>
        <div id="Testing" class="cards-container"></div>
      </div>
      <div class="kanban-col">
        <h3 class="col-title" style="color:#34d399;">✅ Готово <span id="count-Done">0</span></h3>
        <div id="Done" class="cards-container"></div>
      </div>
    </div>
  </main>

  <!-- Модалка создания -->
  <div id="deal-modal" class="modal hidden">
    <div class="modal-content">
      <h3 style="margin-top:0;">Новый проект</h3>
      <div class="input-group">
        <label for="deal-title">Название</label>
        <input type="text" id="deal-title" placeholder="Введите название" />
      </div>
      <div class="input-group">
        <label for="deal-description">Описание</label>
        <textarea id="deal-description" rows="2" placeholder="Краткое описание (необязательно)"></textarea>
      </div>
      <div class="input-group">
        <label for="deal-budget">Бюджет (₸)</label>
        <input type="number" id="deal-budget" value="0" min="0" />
      </div>
      <div class="modal-actions">
        <button class="btn" id="btn-save-deal">Создать</button>
        <button class="btn btn-secondary" id="btn-close-modal">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модалка редактирования -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h3 style="margin-top:0;">✏️ Редактировать</h3>
      <div class="input-group">
        <label for="edit-title">Название</label>
        <input type="text" id="edit-title" placeholder="Введите название" />
      </div>
      <div class="input-group">
        <label for="edit-description">Описание</label>
        <textarea id="edit-description" rows="2" placeholder="Краткое описание"></textarea>
      </div>
      <div class="input-group">
        <label for="edit-budget">Бюджет (₸)</label>
        <input type="number" id="edit-budget" min="0" />
      </div>
      <div class="modal-actions">
        <button class="btn" id="btn-save-edit">Сохранить</button>
        <button class="btn btn-secondary" id="btn-close-edit">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модалка просмотра с комментариями -->
  <div id="view-modal" class="modal hidden">
    <div class="modal-content wide">
      <h3 style="margin-top:0;" id="view-title">📄 Проект</h3>
      <div class="view-field">
        <label>Название</label>
        <div class="value" id="view-name"></div>
      </div>
      <div class="view-field">
        <label>Описание</label>
        <div class="value" id="view-description" style="white-space:pre-wrap; word-break:break-word; max-height:150px; overflow-y:auto;"></div>
      </div>
      <div class="view-field">
        <label>Бюджет</label>
        <div class="value" id="view-budget"></div>
      </div>
      <div class="view-field">
        <label>Статус</label>
        <div class="value" id="view-status"></div>
      </div>
      <div class="view-field">
        <label>Автор</label>
        <div class="value" id="view-author"></div>
      </div>

      <!-- Комментарии -->
      <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:12px;">
        <h4 style="margin:0 0 8px;">💬 Комментарии</h4>
        <div id="comments-container" style="max-height:150px; overflow-y:auto; margin-bottom:8px;"></div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="comment-input" placeholder="Написать комментарий..." style="flex:1;" />
          <button class="btn btn-secondary" id="btn-send-comment" style="width:auto; padding:8px 12px;">Отправить</button>
        </div>
      </div>

      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn" id="btn-view-edit">✏️ Редактировать</button>
        <button class="btn btn-secondary" id="btn-close-view">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модалка профиля (без фото) -->
  <div id="profile-modal" class="modal hidden">
    <div class="modal-content wide">
      <h3 style="margin-top:0;">👤 Профиль</h3>
      <div class="view-field">
        <label>Email</label>
        <div class="value" id="profile-email"></div>
      </div>
      <div class="view-field">
        <label>UID</label>
        <div class="value" id="profile-uid" style="font-size:12px;"></div>
      </div>
      <div class="view-field">
        <label>Дата регистрации</label>
        <div class="value" id="profile-created"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="btn-profile-logout" style="background:var(--danger);">Выйти</button>
        <button class="btn btn-secondary" id="btn-close-profile">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модалка корзины -->
  <div id="trash-modal" class="modal hidden">
    <div class="modal-content wide">
      <h3 style="margin-top:0;">🗑️ Корзина</h3>
      <div id="trash-list" style="max-height:400px; overflow-y:auto;"></div>
      <div style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;">
        <button class="btn btn-danger" id="btn-empty-trash" style="width:auto; padding:8px 16px;">Очистить</button>
        <button class="btn btn-secondary" id="btn-close-trash" style="width:auto; padding:8px 16px;">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Command Palette -->
  <div id="command-palette" class="command-palette hidden">
    <input type="text" id="command-input" placeholder="Поиск или команда..." />
    <div class="command-list" id="command-list"></div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script type="module">
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
      apiKey: "AIzaSyDWYCvGoEQfL_0s7Gpmgtq9gfYXYfazD2M",
      authDomain: "our-crm-eedfc.firebaseapp.com",
      projectId: "our-crm-eedfc",
      storageBucket: "our-crm-eedfc.firebasestorage.app",
      messagingSenderId: "955255949031",
      appId: "1:955255949031:web:0af4e4150d7fe3b453c442"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp,
      where
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const columns = ["Discussion", "In_Progress", "Testing", "Done"];
    let allDeals = [];
    let unsubscribe = null;
    let currentUser = null;
    let editingDealId = null;
    let viewingDealId = null;
    let unsubscribeComments = null;

    // DOM
    const loginScreen = document.getElementById("login-screen");
    const crmScreen = document.getElementById("crm-screen");
    const userInfo = document.getElementById("user-info");
    const dealModal = document.getElementById("deal-modal");
    const editModal = document.getElementById("edit-modal");
    const viewModal = document.getElementById("view-modal");
    const profileModal = document.getElementById("profile-modal");
    const trashModal = document.getElementById("trash-modal");
    const commandPalette = document.getElementById("command-palette");
    const globalSearch = document.getElementById("global-search");
    const trashCountSpan = document.getElementById("trash-count");
    const userAvatarBtn = document.getElementById("user-avatar-btn");
    const commentsContainer = document.getElementById("comments-container");
    const commentInput = document.getElementById("comment-input");

    // ——— Toast ———
    function toast(msg, type = "success") {
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById("toasts").appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    // ——— Auth ———
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const isAuth = !!user;
      loginScreen.classList.toggle("hidden", isAuth);
      crmScreen.classList.toggle("hidden", !isAuth);
      userInfo.classList.toggle("hidden", !isAuth);

      if (isAuth) {
        const email = user.email || "?";
        const initials = email.slice(0, 2).toUpperCase();
        userAvatarBtn.textContent = initials;
        subscribeDeals();
      } else {
        if (unsubscribe) unsubscribe();
        if (unsubscribeComments) unsubscribeComments();
        allDeals = [];
        userAvatarBtn.textContent = "👤";
      }
    });

    document.getElementById("btn-login").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      if (!email || password.length < 6) {
        toast("Email и пароль (мин. 6 символов)", "error");
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
        toast("Вход выполнен");
      } catch (e) {
        toast("Ошибка входа: " + e.message, "error");
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

    // ——— Подписка на проекты ———
    function subscribeDeals() {
      if (unsubscribe) unsubscribe();
      const q = query(collection(db, "deals"), orderBy("createdAt", "desc"));
      unsubscribe = onSnapshot(q, (snap) => {
        allDeals = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderDeals();
        updateTrashCount();
      }, (err) => {
        console.error(err);
        toast("Ошибка загрузки: " + err.message, "error");
      });
    }

    function updateTrashCount() {
      const count = allDeals.filter((d) => d.deleted === true).length;
      trashCountSpan.textContent = count;
    }

    // ——— Отрисовка досок ———
    function renderDeals(filter = "") {
      const term = (filter || globalSearch.value || "").toLowerCase().trim();

      columns.forEach((col) => {
        const container = document.getElementById(col);
        container.innerHTML = "";

        const filtered = allDeals.filter(
          (d) =>
            d.status === col &&
            !d.deleted &&
            (!term || (d.title || "").toLowerCase().includes(term))
        );

        document.getElementById("count-" + col).textContent = filtered.length;

        if (allDeals.filter((d) => !d.deleted).length === 0 && !term) {
          for (let i = 0; i < 2; i++) {
            const sk = document.createElement("div");
            sk.className = "skeleton";
            container.appendChild(sk);
          }
          return;
        }

        filtered.forEach((deal) => {
          const card = document.createElement("div");
          card.className = "deal-card";
          card.draggable = true;
          card.dataset.id = deal.id;

          const content = document.createElement("div");
          content.style.flex = "1";

          const title = document.createElement("div");
          title.className = "deal-title";
          title.textContent = deal.title || "Без названия";
          content.appendChild(title);

          if (deal.description) {
            const desc = document.createElement("div");
            desc.className = "deal-description";
            desc.textContent = deal.description;
            content.appendChild(desc);
          }

          const budget = document.createElement("div");
          budget.className = "deal-budget";
          budget.textContent = Number(deal.budget || 0).toLocaleString("ru-RU") + " ₸";
          content.appendChild(budget);

          const meta = document.createElement("div");
          meta.className = "deal-meta";
          meta.textContent = deal.createdBy ? `от ${deal.createdBy.split("@")[0]}` : "";
          content.appendChild(meta);

          const actions = document.createElement("div");
          actions.className = "card-actions";

          const delBtn = document.createElement("button");
          delBtn.className = "btn-delete";
          delBtn.textContent = "✕";
          delBtn.title = "Удалить";
          delBtn.onclick = (e) => {
            e.stopPropagation();
            softDeleteDeal(deal.id);
          };
          actions.appendChild(delBtn);

          card.append(content, actions);
          container.appendChild(card);

          card.addEventListener("click", () => {
            openViewModal(deal.id);
          });

          card.addEventListener("dblclick", () => {
            openEditModal(deal.id);
          });

          card.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", deal.id);
          });
        });
      });
    }

    // ——— CRUD ———
    async function createDeal() {
      const titleInput = document.getElementById("deal-title");
      const budgetInput = document.getElementById("deal-budget");
      const descInput = document.getElementById("deal-description");
      const title = titleInput.value.trim();
      const budget = Number(budgetInput.value) || 0;
      const description = descInput.value.trim();

      if (!title) {
        toast("Введите название", "error");
        titleInput.focus();
        return;
      }
      try {
        await addDoc(collection(db, "deals"), {
          title,
          budget,
          description,
          status: "Discussion",
          createdAt: serverTimestamp(),
          createdBy: currentUser?.email || "unknown",
          ownerId: currentUser?.uid || null,
          deleted: false,
        });
        titleInput.value = "";
        budgetInput.value = "0";
        descInput.value = "";
        closeModal();
        toast("Проект создан");
      } catch (e) {
        toast("Ошибка: " + e.message, "error");
      }
    }

    function openEditModal(id) {
      const deal = allDeals.find(d => d.id === id);
      if (!deal) return;
      editingDealId = id;
      document.getElementById("edit-title").value = deal.title || "";
      document.getElementById("edit-description").value = deal.description || "";
      document.getElementById("edit-budget").value = deal.budget || 0;
      editModal.classList.remove("hidden");
      document.getElementById("edit-title").focus();
    }

    async function saveEditDeal() {
      const id = editingDealId;
      if (!id) return;
      const title = document.getElementById("edit-title").value.trim();
      const description = document.getElementById("edit-description").value.trim();
      const budget = Number(document.getElementById("edit-budget").value) || 0;

      if (!title) {
        toast("Название не может быть пустым", "error");
        return;
      }

      try {
        await updateDoc(doc(db, "deals", id), {
          title,
          description,
          budget,
        });
        toast("Проект обновлён");
        closeEditModal();
      } catch (e) {
        toast("Ошибка сохранения: " + e.message, "error");
      }
    }

    function closeEditModal() {
      editModal.classList.add("hidden");
      editingDealId = null;
    }

    // ——— Просмотр с комментариями ———
    function openViewModal(id) {
      const deal = allDeals.find(d => d.id === id);
      if (!deal) return;
      viewingDealId = id;
      document.getElementById("view-name").textContent = deal.title || "Без названия";
      document.getElementById("view-description").textContent = deal.description || "—";
      document.getElementById("view-budget").textContent = Number(deal.budget || 0).toLocaleString("ru-RU") + " ₸";
      const statusMap = { "Discussion": "Обсуждение", "In_Progress": "В работе", "Testing": "Тест", "Done": "Готово" };
      document.getElementById("view-status").textContent = statusMap[deal.status] || deal.status;
      document.getElementById("view-author").textContent = deal.createdBy || "—";

      subscribeComments(id);
      viewModal.classList.remove("hidden");
    }

    function closeViewModal() {
      viewModal.classList.add("hidden");
      viewingDealId = null;
      if (unsubscribeComments) {
        unsubscribeComments();
        unsubscribeComments = null;
      }
      commentsContainer.innerHTML = "";
    }

    function subscribeComments(dealId) {
      if (unsubscribeComments) unsubscribeComments();
      const q = query(
        collection(db, "comments"),
        where("dealId", "==", dealId),
        orderBy("createdAt", "asc")
      );
      unsubscribeComments = onSnapshot(q, (snap) => {
        commentsContainer.innerHTML = "";
        if (snap.empty) {
          commentsContainer.innerHTML = '<div style="color:var(--muted); font-size:13px;">Нет комментариев</div>';
          return;
        }
        snap.forEach((doc) => {
          const data = doc.data();
          const div = document.createElement("div");
          div.className = "comment-item";
          div.innerHTML = `
            <div>${data.text}</div>
            <div class="comment-meta">${data.createdBy || "unknown"} — ${data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString() : ""}</div>
          `;
          commentsContainer.appendChild(div);
        });
        commentsContainer.scrollTop = commentsContainer.scrollHeight;
      }, (err) => {
        console.error(err);
        toast("Ошибка комментариев", "error");
      });
    }

    document.getElementById("btn-send-comment").addEventListener("click", async () => {
      if (!viewingDealId) return;
      const text = commentInput.value.trim();
      if (!text) {
        toast("Напишите текст", "error");
        return;
      }
      try {
        await addDoc(collection(db, "comments"), {
          dealId: viewingDealId,
          text,
          createdAt: serverTimestamp(),
          createdBy: currentUser?.email || "anonymous"
        });
        commentInput.value = "";
        toast("Комментарий добавлен");
      } catch (e) {
        toast("Ошибка: " + e.message, "error");
      }
    });

    commentInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("btn-send-comment").click();
      }
    });

    // Кнопка редактирования в модалке просмотра
    document.getElementById("btn-view-edit").addEventListener("click", () => {
      if (viewingDealId) {
        closeViewModal();
        openEditModal(viewingDealId);
      }
    });

    document.getElementById("btn-close-view").addEventListener("click", closeViewModal);
    viewModal.addEventListener("click", (e) => {
      if (e.target === viewModal) closeViewModal();
    });

    // ——— Мягкое удаление ———
    async function softDeleteDeal(id) {
      try {
        await updateDoc(doc(db, "deals", id), {
          deleted: true,
          deletedAt: serverTimestamp(),
        });
        toast("Проект перемещён в корзину");
        updateTrashCount();
      } catch (e) {
        toast("Ошибка удаления", "error");
      }
    }

    async function restoreDeal(id) {
      try {
        await updateDoc(doc(db, "deals", id), {
          deleted: false,
          deletedAt: null,
        });
        toast("Проект восстановлен");
        updateTrashCount();
        renderTrashList();
      } catch (e) {
        toast("Ошибка восстановления", "error");
      }
    }

    async function permanentDeleteDeal(id) {
      if (!confirm("Удалить навсегда?")) return;
      try {
        await deleteDoc(doc(db, "deals", id));
        toast("Удалён безвозвратно");
        updateTrashCount();
        renderTrashList();
      } catch (e) {
        toast("Ошибка удаления", "error");
      }
    }

    async function updateStatus(id, status) {
      try {
        await updateDoc(doc(db, "deals", id), { status });
      } catch (e) {
        toast("Не удалось переместить", "error");
      }
    }

    // ——— Drag & Drop ———
    columns.forEach((colId) => {
      const container = document.getElementById(colId);
      container.addEventListener("dragover", (e) => {
        e.preventDefault();
        container.classList.add("drag-over");
      });
      container.addEventListener("dragleave", () => container.classList.remove("drag-over"));
      container.addEventListener("drop", async (e) => {
        e.preventDefault();
        container.classList.remove("drag-over");
        const id = e.dataTransfer.getData("text/plain");
        if (id) await updateStatus(id, colId);
      });
    });

    // ——— Модалки создания/редактирования ———
    function openModal() {
      dealModal.classList.remove("hidden");
      document.getElementById("deal-title").focus();
    }
    function closeModal() {
      dealModal.classList.add("hidden");
    }
    document.getElementById("btn-open-modal").addEventListener("click", openModal);
    document.getElementById("btn-close-modal").addEventListener("click", closeModal);
    document.getElementById("btn-save-deal").addEventListener("click", createDeal);
    dealModal.addEventListener("click", (e) => {
      if (e.target === dealModal) closeModal();
    });

    document.getElementById("btn-close-edit").addEventListener("click", closeEditModal);
    document.getElementById("btn-save-edit").addEventListener("click", saveEditDeal);
    editModal.addEventListener("click", (e) => {
      if (e.target === editModal) closeEditModal();
    });

    // ——— Профиль ———
    function openProfileModal() {
      if (!currentUser) return;
      const email = currentUser.email || "—";
      const uid = currentUser.uid;
      document.getElementById("profile-email").textContent = email;
      document.getElementById("profile-uid").textContent = uid;
      if (currentUser.metadata && currentUser.metadata.creationTime) {
        document.getElementById("profile-created").textContent = new Date(currentUser.metadata.creationTime).toLocaleString();
      } else {
        document.getElementById("profile-created").textContent = "—";
      }
      profileModal.classList.remove("hidden");
    }
    function closeProfileModal() {
      profileModal.classList.add("hidden");
    }
    userAvatarBtn.addEventListener("click", openProfileModal);
    document.getElementById("btn-close-profile").addEventListener("click", closeProfileModal);
    profileModal.addEventListener("click", (e) => {
      if (e.target === profileModal) closeProfileModal();
    });
    document.getElementById("btn-profile-logout").addEventListener("click", () => {
      signOut(auth);
      closeProfileModal();
    });

    // ——— Корзина (главный блок) ———
    function openTrashModal() {
      trashModal.classList.remove("hidden");
      renderTrashList();
    }
    function closeTrashModal() {
      trashModal.classList.add("hidden");
    }
    document.getElementById("btn-trash").addEventListener("click", openTrashModal);
    document.getElementById("btn-close-trash").addEventListener("click", closeTrashModal);
    trashModal.addEventListener("click", (e) => {
      if (e.target === trashModal) closeTrashModal();
    });

    // Рендер списка корзины
    function renderTrashList() {
      const container = document.getElementById("trash-list");
      const deleted = allDeals.filter((d) => d.deleted === true);
      if (deleted.length === 0) {
        container.innerHTML = `<p style="color:var(--muted);">Корзина пуста</p>`;
        return;
      }
      container.innerHTML = deleted
        .map(
          (deal) => `
            <div class="trash-item">
              <div class="trash-item-info">
                <strong>${deal.title || "Без названия"}</strong>
                ${deal.description ? `<div style="font-size:12px;color:var(--muted);">${deal.description.slice(0, 60)}${deal.description.length > 60 ? "…" : ""}</div>` : ""}
                <span style="color:var(--muted); font-size:12px; margin-left:8px;">
                  ${Number(deal.budget || 0).toLocaleString("ru-RU")} ₸
                </span>
                <span style="color:var(--muted); font-size:11px; display:block; margin-top:2px;">
                  ${deal.createdBy ? deal.createdBy.split("@")[0] : ""}
                  ${deal.deletedAt ? " — удалён " + new Date(deal.deletedAt.seconds * 1000).toLocaleDateString() : ""}
                </span>
              </div>
              <div class="trash-item-actions">
                <button class="restore-btn" data-id="${deal.id}">Восстановить</button>
                <button class="permanent-btn" data-id="${deal.id}">Удалить навсегда</button>
              </div>
            </div>
          `
        )
        .join("");

      container.querySelectorAll(".restore-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          restoreDeal(id);
        });
      });
      container.querySelectorAll(".permanent-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          permanentDeleteDeal(id);
        });
      });
    }

    // Очистка корзины
    document.getElementById("btn-empty-trash").addEventListener("click", async () => {
      const deleted = allDeals.filter((d) => d.deleted === true);
      if (deleted.length === 0) {
        toast("Корзина уже пуста", "error");
        return;
      }
      if (!confirm(`Удалить навсегда ${deleted.length} проектов?`)) return;
      try {
        for (const deal of deleted) {
          await deleteDoc(doc(db, "deals", deal.id));
        }
        toast(`Очищено: ${deleted.length}`);
        updateTrashCount();
        renderTrashList();
      } catch (e) {
        toast("Ошибка очистки", "error");
      }
    });

    // ——— Поиск ———
    globalSearch.addEventListener("input", () => renderDeals());

    // ——— Command Palette ———
    function openCommandPalette() {
      commandPalette.classList.remove("hidden");
      const input = document.getElementById("command-input");
      input.value = "";
      input.focus();
      renderCommands("");
    }
    function closeCommandPalette() {
      commandPalette.classList.add("hidden");
    }

    function renderCommands(term) {
      const list = document.getElementById("command-list");
      const commands = [
        { label: "Новый проект", action: () => { closeCommandPalette(); openModal(); }, kbd: "N" },
        { label: "Экспорт JSON", action: () => { exportJSON(); closeCommandPalette(); }, kbd: "E" },
        { label: "Открыть профиль", action: () => { closeCommandPalette(); openProfileModal(); }, kbd: "P" },
        { label: "Открыть корзину", action: () => { closeCommandPalette(); openTrashModal(); }, kbd: "Del" },
      ];

      const deals = allDeals
        .filter((d) => !d.deleted && (!term || d.title.toLowerCase().includes(term.toLowerCase())))
        .slice(0, 8)
        .map((d) => ({
          label: d.title,
          action: () => {
            globalSearch.value = d.title;
            renderDeals(d.title);
            closeCommandPalette();
          },
          kbd: d.status,
        }));

      const items = term ?
        [...deals, ...commands.filter((c) => c.label.toLowerCase().includes(term.toLowerCase()))] :
        [...commands, ...deals];

      list.innerHTML = items.length ?
        items
        .map(
          (item, i) => `
              <div class="command-item ${i === 0 ? "active" : ""}" data-idx="${i}">
                <span>${item.label}</span>
                <span class="kbd">${item.kbd || ""}</span>
              </div>
            `
        )
        .join("") :
        `<div class="command-item">Ничего не найдено</div>`;

      list.querySelectorAll(".command-item").forEach((el, i) => {
        el.addEventListener("click", () => items[i]?.action());
      });
    }

    document.getElementById("command-input").addEventListener("input", (e) => renderCommands(e.target.value));
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        openCommandPalette();
      }
      if (e.key === "Escape") {
        closeCommandPalette();
        closeModal();
        closeEditModal();
        closeViewModal();
        closeProfileModal();
        closeTrashModal();
      }
    });
    document.addEventListener("click", (e) => {
      if (!commandPalette.contains(e.target) && !e.target.closest("#global-search")) {
        closeCommandPalette();
      }
    });

    // ——— Экспорт / Импорт ———
    function exportJSON() {
      const data = JSON.stringify(allDeals, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `crm-export-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast("Экспорт готов");
    }
    document.getElementById("btn-export").addEventListener("click", exportJSON);

    document.getElementById("btn-import").addEventListener("click", () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json";
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const items = JSON.parse(text);
          if (!Array.isArray(items)) throw new Error("Нужен массив");
          let count = 0;
          for (const item of items) {
            await addDoc(collection(db, "deals"), {
              title: item.title || "Импорт",
              budget: Number(item.budget) || 0,
              description: item.description || "",
              status: columns.includes(item.status) ? item.status : "Discussion",
              createdAt: serverTimestamp(),
              createdBy: currentUser?.email || "import",
              ownerId: currentUser?.uid,
              deleted: false,
            });
            count++;
          }
          toast(`Импортировано: ${count}`);
        } catch (err) {
          toast("Ошибка импорта: " + err.message, "error");
        }
      };
      input.click();
    });

    // Enter на логине
    document.getElementById("login-password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("btn-login").click();
      }
    });
  </script>
</body>
